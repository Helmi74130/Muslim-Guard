<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuslimGuard</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* ============================================
       POPUP SPECIFIC STYLES - Modern & Clean
       ============================================ */

    .popup-container {
      width: 400px;
      background: #ffffff;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    /* ============================================
       HEADER
       ============================================ */

    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
    }

    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-text h1 {
      font-size: 18px;
      font-weight: 600;
      color: #111827;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .logo-text .tagline {
      display: none;
    }

    #statusBadge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }

    /* ============================================
       TOGGLE PROTECTION
       ============================================ */

    .protection-card {
      background: #f9fafb;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #e5e7eb;
    }

    .protection-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .protection-label {
      font-size: 14px;
      font-weight: 500;
      color: #111827;
    }

    /* Toggle Switch */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #d1d5db;
      transition: 0.2s;
      border-radius: 24px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }

    input:checked + .toggle-slider {
      background-color: #10b981;
    }

    input:checked + .toggle-slider:before {
      transform: translateX(20px);
    }

    #statusText {
      font-size: 13px;
      color: #6b7280;
    }

    /* ============================================
       STATS SECTION
       ============================================ */

    .stats-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #e5e7eb;
    }

    .stats-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-weight: 500;
      font-size: 14px;
      color: #111827;
    }

    .stats-header img {
      height: 20px;
      width: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-item {
      background: #f9fafb;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #e5e7eb;
    }

    .stat-label {
      font-size: 11px;
      color: #6b7280;
      text-transform: uppercase;
      font-weight: 500;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 600;
      color: #111827;
      line-height: 1;
    }

    #blockedCount {
      color: #ef4444;
    }

    /* ============================================
       PRAYER CARD
       ============================================ */

    #nextPrayerCard {
      background: #111827;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      color: white;
      border: 1px solid #1f2937;
    }

    .prayer-card-content {
      position: relative;
    }

    .prayer-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 500;
      color: #9ca3af;
    }

    .prayer-card-header img {
      height: 20px;
      width: 20px;
    }

    .prayer-card-body {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    #prayerName {
      font-size: 20px;
      font-weight: 600;
    }

    #prayerTime {
      font-size: 20px;
      font-weight: 600;
      font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
    }

    #prayerCountdown {
      font-size: 13px;
      color: #9ca3af;
      font-weight: 400;
    }

    /* ============================================
       ACHIEVEMENT CARD
       ============================================ */

    #achievementCard {
      background: #fef3c7;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #fde68a;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #achievementCard.hidden {
      display: none;
    }

    #achievementIcon {
      font-size: 24px;
    }

    #achievementName {
      font-weight: 500;
      font-size: 14px;
      color: #78350f;
      margin: 0;
    }

    .achievement-text {
      font-size: 12px;
      color: #92400e;
      font-weight: 400;
      margin: 0;
    }

    /* ============================================
       ACTION BUTTONS
       ============================================ */

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    #dashboardBtn,
    #optionsBtn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    #dashboardBtn {
      background: #111827;
      color: white;
    }

    #dashboardBtn:hover {
      background: #1f2937;
    }

    #optionsBtn {
      background: white;
      color: #111827;
      border: 1px solid #e5e7eb;
    }

    #optionsBtn:hover {
      background: #f9fafb;
    }

    #dashboardBtn:active,
    #optionsBtn:active {
      transform: scale(0.98);
    }

    /* ============================================
       FOOTER
       ============================================ */

    .popup-footer {
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }

    .popup-footer p {
      margin: 0;
    }

    /* ============================================
       MODAL PIN
       ============================================ */

    #pinModal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      margin: -16px;
    }

    #pinModal.flex {
      display: flex;
    }

    #pinModal.hidden {
      display: none;
    }

    .modal-content {
      background: white;
      border-radius: var(--radius-lg);
      padding: var(--spacing-xl);
      box-shadow: var(--shadow-xl);
      max-width: 320px;
      width: 90%;
      animation: slideIn var(--transition-slow) ease-out;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-lg);
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--gray-800);
    }

    .modal-icon {
      font-size: 1.5rem;
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% {
        transform: translateX(0);
      }
      25% {
        transform: translateX(-5px);
      }
      75% {
        transform: translateX(5px);
      }
    }

    #pinInput {
      width: 100%;
      padding: var(--spacing-md) var(--spacing-md);
      font-size: 1.5rem;
      letter-spacing: 0.5rem;
      text-align: center;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-md);
      margin-bottom: var(--spacing-lg);
      transition: all var(--transition);
      font-weight: 600;
      font-family: 'Courier New', monospace;
    }

    #pinInput:focus {
      outline: none;
      border-color: var(--primary-500);
      box-shadow: 0 0 0 3px var(--primary-50);
    }

    #pinInput::placeholder {
      color: var(--gray-300);
      letter-spacing: 0.2rem;
    }

    #pinError {
      color: var(--danger-500);
      font-size: 0.85rem;
      margin-bottom: var(--spacing-md);
      animation: slideIn var(--transition-fast) ease-out;
    }

    #pinError.hidden {
      display: none;
    }

    .modal-buttons {
      display: flex;
      gap: var(--spacing-md);
    }

    #pinCancel,
    #pinSubmit {
      flex: 1;
      padding: var(--spacing-md) var(--spacing-lg);
      font-weight: 600;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition);
      font-size: 0.95rem;
    }

    #pinCancel {
      background: var(--gray-100);
      color: var(--gray-800);
    }

    #pinCancel:hover {
      background: var(--gray-200);
    }

    #pinSubmit {
      background: var(--primary-500);
      color: white;
    }

    #pinSubmit:hover {
      background: var(--primary-600);
    }

    #pinCancel:active,
    #pinSubmit:active {
      transform: scale(0.98);
    }

    /* ============================================
       ANIMATIONS
       ============================================ */

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================================
       SCROLLBAR STYLING
       ============================================ */

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--gray-100);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary-300);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary-400);
    }

    /* ============================================
       RESPONSIVE
       ============================================ */

    @media (max-width: 400px) {
      body {
        width: 100%;
      }

      .popup-container {
        padding: var(--spacing-md);
      }

      .logo-text h1 {
        font-size: 1.1rem;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .modal-content {
        width: 95%;
      }
    }
  </style>
</head>
<body class="bg-gray-50">
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="header-left">
        <div class="logo-icon">
          <img src="/assets/logo MG.png" alt="Muslim Guard">
        </div>
        <div class="logo-text">
          <h1>Muslim Guard</h1>
        </div>
      </div>
      <div id="statusBadge">
        <!-- Rempli par JS -->
      </div>
    </div>

    <!-- Protection Toggle -->
    <div class="protection-card">
      <div class="protection-header">
        <label class="protection-label" for="protectionToggle">
          Protection
        </label>
        <label class="toggle-switch">
          <input type="checkbox" id="protectionToggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <p id="statusText">
        <!-- Rempli par JS -->
      </p>
    </div>

    <!-- Stats -->
    <div class="stats-card">
      <div class="stats-header">
        <span>Statistiques</span>
      </div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-label">Sites bloqués</div>
          <div id="blockedCount" class="stat-value">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Jours de streak</div>
          <div id="streakDays" class="stat-value">0</div>
        </div>
      </div>
    </div>

    <!-- Prayer Card -->
    <div id="nextPrayerCard">
      <div class="prayer-card-content">
        <div class="prayer-card-header">
          <span>Prochaine prière</span>
        </div>
        <div class="prayer-card-body">
          <div id="prayerName">Dhuhr</div>
          <div id="prayerTime">13:00</div>
        </div>
        <div id="prayerCountdown">Dans 2h 15min</div>
      </div>
    </div>

    <!-- Achievement Card -->
    <div id="achievementCard" class="hidden">
      <div id="achievementIcon"></div>
      <div>
        <p id="achievementName"></p>
        <p class="achievement-text">Débloqué</p>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button id="dashboardBtn">
        <span>Dashboard</span>
      </button>
      <button id="optionsBtn">
        <span>Paramètres</span>
      </button>
    </div>

    <!-- Footer -->
    <div class="popup-footer">
      <p>Version 1.0.0</p>
    </div>
  </div>

  <!-- Modal PIN -->
  <div id="pinModal" class="hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-icon">🔒</span>
        <span>Code PIN requis</span>
      </div>
      <input
        type="password"
        id="pinInput"
        maxlength="6"
        placeholder="• • • • • •"
      >
      <div id="pinError" class="hidden"></div>
      <div class="modal-buttons">
        <button id="pinCancel">
          Annuler
        </button>
        <button id="pinSubmit">
          Valider
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
