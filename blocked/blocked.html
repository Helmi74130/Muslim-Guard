<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Bloqué - MuslimGuard</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #00305A;
    }

    .blocked-container {
      max-width: 600px;
      width: 100%;
    }

    /* Header */
    .blocked-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header-icon {
      margin-bottom: 24px;
    }

    .header-icon img {
      height: 80px;
    }

    .header-subtitle {
      display: inline-block;
      background: white;
      color: #00305A;
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    /* Main Card */
    .blocked-card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
    }

    .blocked-card h2 {
      font-size: 24px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }

    .reason-box {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    #reasonText {
      color: #6b7280;
      font-weight: 400;
      line-height: 1.6;
      font-size: 15px;
    }

    #customMessage {
      background: #f9fafb;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 24px;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
    }

    .blocked-url-label {
      font-size: 11px;
      color: #6b7280;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .blocked-url {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 12px;
      border-radius: 8px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 13px;
      word-break: break-all;
      color: #111827;
    }

    /* Verse Card */
    .verse-card {
      background: #111827;
      color: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .verse-content {
      width: 100%;
    }

    .verse-text {
      width: 100%;
    }

    #verseText {
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 12px;
      font-style: italic;
      font-weight: 400;
    }

    #verseRef {
      font-size: 13px;
      color: #9ca3af;
      font-weight: 400;
    }

    /* Prayer Card */
    .prayer-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .prayer-left {
      flex: 1;
    }

    .prayer-title {
      font-size: 12px;
      color: #6b7280;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .prayer-name {
      font-size: 20px;
      font-weight: 600;
      color: #111827;
    }

    .prayer-right {
      text-align: right;
    }

    .prayer-countdown-label {
      font-size: 11px;
      color: #6b7280;
      font-weight: 500;
      margin-bottom: 4px;
    }

    #prayerCountdown p {
      font-size: 24px;
      font-weight: 600;
      color: #00305A;
      margin: 0;
    }

    /* Footer */
    .blocked-footer {
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
    }

    .blocked-footer p {
      margin: 8px 0;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }

      .header-icon img {
        height: 60px;
      }

      .blocked-card {
        padding: 24px;
      }

      .verse-card {
        padding: 20px;
      }

      #verseText {
        font-size: 15px;
      }

      .prayer-card {
        flex-direction: column;
        align-items: flex-start;
      }

      .prayer-right {
        text-align: left;
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .blocked-card h2 {
        font-size: 20px;
      }

      #verseText {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="blocked-container">
    <!-- Header -->
    <div class="blocked-header">
      <div class="header-icon">
        <img src="/assets/Logo tagline.png" alt="MuslimGuard">
      </div>
      <div class="header-subtitle">Site bloqué</div>
    </div>

    <!-- Main Blocked Message -->
    <div class="blocked-card">
      <h2>Ce site a été bloqué</h2>

      <div id="reasonBox" class="reason-box">
        <p id="reasonText"></p>
      </div>

      <div id="customMessage"></div>

      <div>
        <div class="blocked-url-label">URL bloquée</div>
        <div class="blocked-url" id="blockedUrl"></div>
      </div>
    </div>

    <!-- Quranic Verse -->
    <div class="verse-card">
      <div class="verse-content">
        <div class="verse-text">
          <p id="verseText"></p>
          <p id="verseRef"></p>
        </div>
      </div>
    </div>

    <!-- Prayer Time -->
    <div class="prayer-card">
      <div class="prayer-left">
        <div class="prayer-title">Prochaine prière</div>
        <div class="prayer-name" id="nextPrayerText"></div>
      </div>
      <div class="prayer-right">
        <div class="prayer-countdown-label">Dans</div>
        <div id="prayerCountdown">
          <p>--</p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="blocked-footer">
      <p>MuslimGuard</p>
    </div>
  </div>

  <script type="module" src="blocked.js"></script>
</body>
</html>
